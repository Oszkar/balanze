name: pages

# Builds the mdBook docs site (book.toml, src = docs/src) and deploys it to
# GitHub Pages via the native Actions flow - no gh-pages branch, no
# third-party deploy action. mdbook itself is fetched as a prebuilt binary
# from its own GitHub release rather than `cargo install`d, so this stays
# fast and does not touch the workspace's vetted Cargo dependency graph
# (AGENTS.md §1 / deny.toml).

on:
  push:
    branches: [main]
    paths:
      - "docs/src/**"
      - "theme/**"
      - "book.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deploy in flight at a time; never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false - the build only reads the checked-out files,
      # and publishing uses the Pages OIDC token, not the git credential helper.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mdBook
        env:
          MDBOOK_VERSION: v0.5.4
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          curl -sSL --fail -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C /usr/local/bin
          rm mdbook.tar.gz

      - name: Build book
        run: mdbook build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
